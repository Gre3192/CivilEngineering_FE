<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Diagramma tensioni-deformazioni</title>
  <desc id="desc">Schema qualitativo con assi delle tensioni e delle deformazioni, retta dell'acciaio e andamento del calcestruzzo.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#374151" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #374151; }
      .math { font-family: "Times New Roman", Georgia, serif; font-style: italic; }
    </style>
  </defs>
  <rect width="900" height="560" fill="#fff"/>
  <!-- Axes -->
  <path d="M105 280 H610" stroke="#374151" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M350 500 V55" stroke="#374151" stroke-width="2.2" marker-end="url(#arrow)"/>
  <circle cx="350" cy="280" r="4" fill="#374151"/>
  <text x="610" y="316" font-size="25" class="math">ε<tspan baseline-shift="sub" font-size="16">s</tspan>, ε<tspan baseline-shift="sub" font-size="16">c</tspan></text>
  <text x="220" y="65" font-size="25" class="math">σ<tspan baseline-shift="sub" font-size="16">s</tspan>, σ<tspan baseline-shift="sub" font-size="16">c</tspan></text>
  <!-- Steel elastic line -->
  <path d="M240 455 L480 100" fill="none" stroke="#315eea" stroke-width="5" stroke-linecap="round"/>
  <text x="476" y="88" font-size="25" font-weight="600" fill="#315eea">Acciaio</text>
  <!-- Concrete response, schematic -->
  <path d="M105 292 L590 268" fill="none" stroke="#a43c43" stroke-width="4" stroke-linecap="round"/>
  <text x="555" y="236" font-size="24" font-style="italic" fill="#a43c43">cls</text>
  <!-- Characteristic stress levels -->
  <g stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="6 6">
    <path d="M350 100 H480"/><path d="M350 190 H420"/><path d="M350 370 H320"/><path d="M350 455 H240"/>
  </g>
  <g font-size="20" class="math" text-anchor="end">
    <text x="337" y="106">σ<tspan baseline-shift="sub" font-size="14">s</tspan><tspan baseline-shift="super" font-size="14">R</tspan></text>
    <text x="337" y="196">σ<tspan baseline-shift="sub" font-size="14">c</tspan><tspan baseline-shift="super" font-size="14">R</tspan></text>
    <text x="337" y="376">σ<tspan baseline-shift="sub" font-size="14">c</tspan><tspan baseline-shift="super" font-size="14">R</tspan></text>
    <text x="337" y="461">σ<tspan baseline-shift="sub" font-size="14">s</tspan><tspan baseline-shift="super" font-size="14">R</tspan></text>
  </g>
  <!-- Angles and modulus labels -->
  <path d="M350 280 A55 55 0 0 1 380 233" fill="none" stroke="#7c8797" stroke-width="1.8"/>
  <path d="M350 280 A69 69 0 0 1 418 273" fill="none" stroke="#7c8797" stroke-width="1.8"/>
  <text x="378" y="250" font-size="20" class="math">α</text>
  <text x="405" y="266" font-size="20" class="math">β</text>
  <text x="650" y="115" font-size="23" fill="#6b7280">dove:</text>
  <text x="650" y="162" font-size="24" class="math">tg α = E<tspan baseline-shift="sub" font-size="16">s</tspan></text>
  <text x="650" y="210" font-size="24" class="math">tg β = E<tspan baseline-shift="sub" font-size="16">c</tspan></text>
</svg>
